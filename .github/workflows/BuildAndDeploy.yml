name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ENV: production

      - name: Deploy frontend via SFTP
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ${{ secrets.FRONTEND_SFTP_HOST }}
          port: ${{ secrets.FRONTEND_SFTP_PORT || 22 }}
          username: ${{ secrets.FRONTEND_SFTP_USERNAME }}
          key: ${{ secrets.FRONTEND_SFTP_PRIVATE_KEY }}
          uploads: |
            dist/ => ${{ secrets.FRONTEND_REMOTE_PATH }}
          delete: false

  backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy backend source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          port: ${{ secrets.BACKEND_SSH_PORT || 22 }}

          source: "backend/**,backend/.dockerignore"
          target: ${{ secrets.BACKEND_REMOTE_PATH }}
          strip_components: 1
          overwrite: true

      - name: Build and restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          port: ${{ secrets.BACKEND_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.BACKEND_REMOTE_PATH }}
            cat > .env <<'EOF'
            ${{ secrets.BACKEND_ENV_FILE }}
            EOF
            chmod 600 .env
            # docker compose up -d --build --remove-orphans
            # docker image prune -f
