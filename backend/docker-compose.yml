version: '3.8'

services:
  nextcloud-register-backend:
    build: .
    container_name: nextcloud-register-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_DEFAULT_GROUP=${NEXTCLOUD_DEFAULT_GROUP:-IWI}
      - RAUMZEIT_URL=${RAUMZEIT_URL}
    volumes:
      - ./logs:/app/logs
    networks:
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nginx-proxy-manager_default:
    external: true

volumes:
  logs:
